[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-eda-full-fledge"
version = "1.0.0"
description = " loan default ML project with versioning, logging, Flask prediction API and multi-model reports"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
    "scikit-learn==1.3.2",
    "statsmodels>=0.14,<1",
    "scipy>=1.11,<2",
    "shap>=0.44,<1",
    "joblib>=1.3,<2",
    "xgboost>=2.0,<3",
    "Flask>=3.0,<4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.taskipy.tasks]
data = "python -m src.dataset"
features = "python -m src.features"
train = "python -m src.train"
predict = "python -m src.predict"
reports = "python -m src.reports"
api = "python -m src.api"
test = "pytest tests/ -v"
lint = "ruff check src tests"
format = "ruff format src tests"
all = "python -m src.dataset && python -m src.features && python -m src.train && python -m src.predict && python -m src.reports"

